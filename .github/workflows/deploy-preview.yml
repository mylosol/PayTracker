# PayTracker — preview-channel deployment.
#
# Trigger:  push to any `feature/**` branch
# Target:   Web Host Most (cPanel / LiteSpeed)
#           ${{ secrets.WHM_PREVIEW_BASE_PATH }}
#           (typically /home/<user>/domains/preview.paytracker.xyz/public_html)
# URL:      https://preview.paytracker.xyz/
#
# Goal of the preview channel: let stakeholders validate a branch end-to-end
# without ever touching production code, files, or session cookies. Because
# the preview lives on a separate subdomain (preview.paytracker.xyz) the
# session cookie naturally scopes away from production.
#
# The preview deploy WILL overwrite anything previously deployed there —
# that is by design; only one branch is "previewed live" at a time. Re-running
# the workflow from a different feature branch swaps it in.
#
# Secrets required:
#   WHM_SSH_HOST          cPanel SSH host (often the cPanel domain itself)
#   WHM_SSH_USER          cPanel account user
#   WHM_SSH_PORT          cPanel SSH port (commonly 22 or 21098)
#   WHM_SSH_KEY           SSH private key with deploy access
#   WHM_PREVIEW_BASE_PATH absolute path to the preview subdomain's docroot
#   WHM_DB_NAME / WHM_DB_USER / WHM_DB_PASS   MySQL credentials
#   APP_KEY  MAPS_API_PAT  RESEND_API  MAIL_FROM (latter two optional)
#
# Optional (Playwright E2E tests skip gracefully when unset):
#   QA_TEST_USER       login handle for the seeded preview test account
#   QA_TEST_PASSWORD   the password the deploy seeds into that account
#                      via scripts/set-password.php on every run

name: Deploy preview

on:
  push:
    branches:
      - 'feature/**'
  workflow_dispatch:

concurrency:
  group: deploy-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Web Host Most (preview)
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Pin the CI runtime to PHP 8.2. WHM/cPanel hosts typically expose
      # multiple PHP versions but our scripts target 8.3 features; linting
      # against 8.2 catches anything that won't run on a slightly older
      # host. The live preview's PHP version is whatever's configured in
      # cPanel's MultiPHP Manager.
      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mbstring, json
          coverage: none
          tools: composer:v2

      - name: Validate composer manifest
        run: composer validate --strict

      - name: Install PHP dependencies (with dev for static analysis)
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Syntax-check all new PHP sources
        run: |
          set -euo pipefail
          find app bootstrap config public routes -name '*.php' -print0 \
            | xargs -0 -n1 php -l > /dev/null

      - name: Validate PSR-4 autoload mapping
        run: composer dump-autoload --optimize --strict-psr --no-interaction

      - name: Static analysis (phpstan)
        run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress --error-format=github

      - name: PHP unit tests
        run: vendor/bin/phpunit --colors=never

      - name: Re-install without dev dependencies (for deploy)
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      # Compile the Tailwind stylesheet into public/assets/app.css before
      # rsync. The remote host has no Node runtime; the build has to happen
      # here, and the resulting file rides along in the rsynced tree.
      - name: Set up Node.js for CSS build
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies for CSS build
        run: npm install --no-audit --no-fund

      - name: Build Tailwind CSS (minified)
        run: npm run css:build

      # ----- Prepare SSH ---------------------------------------------------
      # WHM/cPanel hosts often use a non-standard SSH port. We pin the
      # known-hosts entry on first connect via StrictHostKeyChecking=accept-new
      # rather than shipping a pre-computed WHM_KNOWN_HOSTS secret, so a
      # legitimate host-key rotation just re-fingerprints rather than
      # failing the deploy. Re-pinning would require deleting the
      # known_hosts entry in this job's tempdir which doesn't persist.
      - name: Install SSH key
        env:
          WHM_SSH_KEY:  ${{ secrets.WHM_SSH_KEY }}
          WHM_SSH_HOST: ${{ secrets.WHM_SSH_HOST }}
          WHM_SSH_PORT: ${{ secrets.WHM_SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$WHM_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${WHM_SSH_PORT}" "$WHM_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

      - name: Ensure preview directory exists on remote
        env:
          REMOTE: ${{ secrets.WHM_SSH_USER }}@${{ secrets.WHM_SSH_HOST }}
          PORT:   ${{ secrets.WHM_SSH_PORT }}
          DEST:   ${{ secrets.WHM_PREVIEW_BASE_PATH }}
        run: |
          ssh -p "$PORT" -i ~/.ssh/id_ed25519 "$REMOTE" "mkdir -p '$DEST'"

      # Rsync deploys the project root INTO the docroot. The root .htaccess
      # rewrites every non-static request to public/index.php, which is the
      # modern front controller. The legacy PHP tree is NOT rsynced -- this
      # host carries the modern app only (Robert's call during the WHM
      # migration). Excluded paths are CI / framework / dev-only files.
      - name: Rsync repository to preview path
        env:
          REMOTE: ${{ secrets.WHM_SSH_USER }}@${{ secrets.WHM_SSH_HOST }}
          PORT:   ${{ secrets.WHM_SSH_PORT }}
          DEST:   ${{ secrets.WHM_PREVIEW_BASE_PATH }}
        run: |
          set -euo pipefail
          rsync -avz --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='playwright-report/' \
            --exclude='test-results/' \
            --exclude='blob-report/' \
            --exclude='playwright.config.ts' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='.PayTracker/' \
            --exclude='.env' \
            --exclude='.env.local' \
            -e "ssh -p $PORT -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new" \
            ./ "$REMOTE:$DEST/"

      # Promote the preview-specific root .htaccess into place. The repo
      # version is named differently so it stays inert during local
      # development.
      - name: Activate preview .htaccess
        env:
          REMOTE: ${{ secrets.WHM_SSH_USER }}@${{ secrets.WHM_SSH_HOST }}
          PORT:   ${{ secrets.WHM_SSH_PORT }}
          DEST:   ${{ secrets.WHM_PREVIEW_BASE_PATH }}
        run: |
          ssh -p "$PORT" -i ~/.ssh/id_ed25519 "$REMOTE" \
            "cp '$DEST/deploy/preview.htaccess' '$DEST/.htaccess'"

      - name: Write preview .env on remote
        env:
          REMOTE:    ${{ secrets.WHM_SSH_USER }}@${{ secrets.WHM_SSH_HOST }}
          PORT:      ${{ secrets.WHM_SSH_PORT }}
          DEST:      ${{ secrets.WHM_PREVIEW_BASE_PATH }}
          APP_KEY:   ${{ secrets.APP_KEY }}
          DB_NAME:   ${{ secrets.WHM_DB_NAME }}
          DB_USER:   ${{ secrets.WHM_DB_USER }}
          DB_PASS:   ${{ secrets.WHM_DB_PASS }}
          MAPS_KEY:  ${{ secrets.MAPS_API_PAT }}
          RESEND_KEY: ${{ secrets.RESEND_API }}
          MAIL_FROM_ADDR: ${{ secrets.MAIL_FROM }}
          BRANCH:    ${{ github.ref_name }}
          COMMIT:    ${{ github.sha }}
          RUN_NUM:   ${{ github.run_number }}
        run: |
          set -euo pipefail
          ssh -p "$PORT" -i ~/.ssh/id_ed25519 "$REMOTE" "cat > '$DEST/.env'" <<EOF
          APP_ENV=preview
          APP_DEBUG=true
          APP_NAME="PayTracker (preview: ${BRANCH})"
          APP_URL=https://preview.paytracker.xyz
          APP_TIMEZONE=America/Chicago
          APP_KEY=${APP_KEY}

          # cPanel-default DB host. The preview subdomain points at the
          # WHM-side schema migrated from DreamHost; same per-table layout,
          # different credentials.
          DB_HOST=localhost
          DB_PORT=3306
          DB_DATABASE=${DB_NAME}
          DB_USERNAME=${DB_USER}
          DB_PASSWORD=${DB_PASS}
          DB_CHARSET=utf8mb4

          SESSION_NAME=paytracker_preview_session
          SESSION_LIFETIME_MIN=120
          SESSION_SECURE_COOKIE=true
          SESSION_SAMESITE=Lax

          GOOGLE_MAPS_API_KEY=${MAPS_KEY}

          # Resend transactional email. Empty RESEND_API disables sending;
          # the admin panel still shows the reset URL in the flash banner
          # so the action keeps working.
          RESEND_API=${RESEND_KEY}
          MAIL_FROM="${MAIL_FROM_ADDR:-PayTracker <noreply@paytracker.xyz>}"

          # Build provenance — surfaced on /health and in the footer.
          BUILD_BRANCH=${BRANCH}
          BUILD_COMMIT=${COMMIT}
          BUILD_NUMBER=${RUN_NUM}
          EOF
          ssh -p "$PORT" -i ~/.ssh/id_ed25519 "$REMOTE" "chmod 600 '$DEST/.env'"

      - name: Apply database migrations on remote
        env:
          REMOTE: ${{ secrets.WHM_SSH_USER }}@${{ secrets.WHM_SSH_HOST }}
          PORT:   ${{ secrets.WHM_SSH_PORT }}
          DEST:   ${{ secrets.WHM_PREVIEW_BASE_PATH }}
        run: |
          ssh -p "$PORT" -i ~/.ssh/id_ed25519 "$REMOTE" \
            "cd '$DEST' && php scripts/migrate.php"

      - name: Sync QA test account password (preview only)
        env:
          REMOTE:  ${{ secrets.WHM_SSH_USER }}@${{ secrets.WHM_SSH_HOST }}
          PORT:    ${{ secrets.WHM_SSH_PORT }}
          DEST:    ${{ secrets.WHM_PREVIEW_BASE_PATH }}
          QA_USER: ${{ secrets.QA_TEST_USER }}
          QA_PASS: ${{ secrets.QA_TEST_PASSWORD }}
        run: |
          if [ -z "$QA_USER" ] || [ -z "$QA_PASS" ]; then
            echo "QA_TEST_USER / QA_TEST_PASSWORD not configured in repo secrets — skipping password sync."
            echo "Playwright auth tests will skip themselves; non-auth tests still run."
            exit 0
          fi
          ssh -p "$PORT" -i ~/.ssh/id_ed25519 "$REMOTE" \
            "cd '$DEST' && php scripts/set-password.php '$QA_USER' '$QA_PASS' --role=super_admin"

      - name: Smoke test (preview /health.json)
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 \
            "https://preview.paytracker.xyz/health.json" \
            | tee preview-health.json
          test "$(jq -r .database.ok preview-health.json)" = "true"

      # ----- Playwright end-to-end suite -----------------------------------
      - name: Set up Node.js 20 (for Playwright)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright browser (Chromium only)
        run: npx playwright install --with-deps chromium

      - name: Run Playwright suite against the live preview
        env:
          BASE_URL:         https://preview.paytracker.xyz/
          QA_TEST_USER:     ${{ secrets.QA_TEST_USER }}
          QA_TEST_PASSWORD: ${{ secrets.QA_TEST_PASSWORD }}
        run: npx playwright test --reporter=github,list

      - name: Sweep QA test data from preview DB
        if: always()
        env:
          REMOTE: ${{ secrets.WHM_SSH_USER }}@${{ secrets.WHM_SSH_HOST }}
          PORT:   ${{ secrets.WHM_SSH_PORT }}
          DEST:   ${{ secrets.WHM_PREVIEW_BASE_PATH }}
        run: |
          ssh -p "$PORT" -i ~/.ssh/id_ed25519 "$REMOTE" \
            "cd '$DEST' && php scripts/qa-cleanup.php --apply"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
