/**
 * Site-wide footer fragment.
 *
 * Renders the dynamic version token assembled by include/Version.php from the
 * CI-produced `.version` artifact, with safe fallbacks if the artifact is
 * absent (e.g. local dev, direct FTP upload). Defensive guards ensure that a
 * missing/unreadable Version.php never aborts the surrounding page render.
 */
$ptVersionDisplay = 'dev';
$ptVersionHelper  = __DIR__ . DIRECTORY_SEPARATOR . 'Version.php';
if (is_readable($ptVersionHelper)) {
    require_once $ptVersionHelper;
    if (class_exists('Version')) {
        try {
            $ptVersionDisplay = Version::html();
        } catch (\Throwable) {
            $ptVersionDisplay = 'dev';
        }
    }
}
